<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Clakete hero banners</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Geist:wght@400;500;600&display=swap"
    />
    <style>
      @font-face {
        font-family: "Virgil";
        src: url("https://excalidraw.com/Virgil.woff2") format("woff2");
        font-display: block;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #111;
        padding: 24px;
      }

      .banner {
        width: 1280px;
        height: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 24px;
        background: #ff0048;
        overflow: hidden;
      }

      .title {
        font-family: Virgil, Caveat, "Segoe Print", cursive;
        font-size: 96px;
        line-height: 1;
        color: #fff;
        letter-spacing: 0.02em;
        transform: rotate(-1.2deg);
        user-select: none;
      }

      .subtitle {
        font-family: Geist, system-ui, sans-serif;
        font-weight: 500;
        font-size: 22px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.92);
        text-align: center;
        max-width: 820px;
        padding: 0 32px;
      }

      .subtitle .line2 {
        display: block;
        margin-top: 4px;
        font-weight: 400;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.78);
      }
    </style>
  </head>
  <body>
    <div class="banner" data-name="hero-title">
      <div class="title">Clakete :3</div>
    </div>

    <div class="banner" data-name="hero-title-sub">
      <div class="title">Clakete :3</div>
      <p class="subtitle">
        Rede social de filmes e séries
        <span class="line2"
          >Descubra, registre e compartilhe o que você assiste.</span
        >
      </p>
    </div>
  </body>
</html>
